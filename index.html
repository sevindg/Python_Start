<style>
:root{
  --bg:#eef3f9; --card:#fff; --ink:#1e2a45; --muted:#7a869f; --line:#e3e9f2;
  --soft:#f3f5fa; --soft-h:#f7f9fc; --off:#f1f3f7; --off-line:#e4e8ef; --off-ink:#9aa4b6;
  --sub:#4b5774; --bar-bg:#eef2f8; --body2:#fbfcfe; --code-ink:#8a5a00;
  --green:#12b886; --green-d:#0c9a70; --green-l:#e6f8f1;
  --yellow:#ffc53d; --yellow-l:#fff6dc; --purple:#7c4dff; --purple-l:#f1ebff;
  --red:#f03e3e; --red-l:#fff0f0; --blue:#3b82f6; --blue-l:#eaf2ff; --gray:#c3cbd8;
  --shadow:0 2px 0 rgba(30,42,69,.04),0 8px 24px rgba(30,42,69,.06);
  --toast-bg:#1e2a45; --toast-ink:#fff; --overlay:rgba(30,42,69,.5);
  --login-bg:radial-gradient(circle at 20% 10%,#d3f9d8 0,transparent 40%),radial-gradient(circle at 90% 90%,#e5dbff 0,transparent 40%),var(--bg);
  color-scheme:light;
}
/* ===== ТЁМНАЯ ТЕМА (включается кнопкой 🌙/☀️) ===== */
html[data-theme="dark"]{
  --bg:#0e1524; --card:#182136; --ink:#e9eef8; --muted:#8e9ab3; --line:#2b3652;
  --soft:#232e49; --soft-h:#2a3757; --off:#1e2740; --off-line:#2c3854; --off-ink:#66738f;
  --sub:#a9b4cc; --bar-bg:#232e49; --body2:#1f2942; --code-ink:#ffd43b;
  --green:#12b886; --green-d:#38d9a9; --green-l:#14332a;
  --yellow:#ffc53d; --yellow-l:#3a2f0e; --purple:#9775fa; --purple-l:#2a2350;
  --red:#ff6b6b; --red-l:#3b1d20; --blue:#4dabf7; --blue-l:#1b2b4a; --gray:#4a5568;
  --shadow:0 2px 0 rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.4);
  --toast-bg:#e9eef8; --toast-ink:#16203a; --overlay:rgba(4,8,18,.65);
  --login-bg:radial-gradient(circle at 20% 10%,rgba(32,201,151,.14) 0,transparent 40%),radial-gradient(circle at 90% 90%,rgba(124,77,255,.16) 0,transparent 40%),var(--bg);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;transition:background .25s,color .25s}
button,input,select{font-family:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.muted{color:var(--muted)}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow)}

/* header */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#20c997,#0ca678);display:grid;place-items:center;box-shadow:0 4px 12px rgba(18,184,134,.35);font-size:24px}
.brand b{font-size:20px;font-weight:900;display:block}
.brand span{font-size:12.5px;color:var(--muted)}
.who{display:flex;align-items:center;gap:8px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 5px;font-weight:800;font-size:14px}
.who i{width:30px;height:30px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;font-style:normal}
.pill{border:1px solid var(--line);background:var(--card);padding:9px 14px;border-radius:12px;font-weight:800;font-size:14px;color:var(--ink);white-space:nowrap}
.pill:hover{background:var(--soft-h)}
.pill.on{background:var(--yellow);border-color:#f5b400;color:#3a2a00}
main{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
.btn{border:0;border-radius:14px;padding:13px 20px;font-weight:900;font-size:15.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.15s;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn.green{background:linear-gradient(180deg,#20c997,#0ca678);color:#fff;box-shadow:0 4px 0 #087f5b}
.btn.purple{background:linear-gradient(180deg,#9775fa,#7048e8);color:#fff;box-shadow:0 4px 0 #5f3dc4}
.btn.white{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.btn.red{background:var(--red-l);color:var(--red);border:1px solid #ffc9c9}
.btn:hover{filter:brightness(1.04)}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.banner{display:flex;gap:12px;align-items:flex-start;background:var(--yellow-l);border:1px solid #ffe08a;border-radius:16px;padding:12px 16px;margin-bottom:18px;font-size:14.5px;line-height:1.45}

/* login */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--login-bg)}
.login{width:100%;max-width:430px;padding:28px}
.login h1{margin:10px 0 2px;font-size:26px;text-align:center}
.login .sub{text-align:center;color:var(--muted);margin-bottom:18px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:16px}
.seg button{border:0;background:transparent;padding:10px;border-radius:11px;font-weight:800;color:var(--sub);font-size:14.5px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 6px rgba(30,42,69,.1)}
label.f{display:block;font-weight:800;font-size:13.5px;margin:10px 0 4px}
.inp{width:100%;font-size:16px;border:2px solid var(--line);border-radius:12px;padding:11px 13px;font-weight:700;color:var(--ink);background:var(--card);outline:none}
.inp:focus{border-color:#96e2c7}
.login .btn{width:100%;margin-top:18px}
.err{color:var(--red);font-weight:800;font-size:14px;margin-top:10px;min-height:20px}
.hint{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.4}

/* student */
.hello{display:flex;align-items:center;gap:18px;padding:20px 22px;margin-bottom:22px;flex-wrap:wrap}
.hello h2{margin:0;font-size:26px}
.hello p{margin:4px 0 0;color:var(--sub)}
.hello .grow{flex:1;min-width:220px}
.bar{height:12px;background:var(--bar-bg);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#20c997,#0ca678);border-radius:9px;transition:width .4s}
h3.sec{font-size:19px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.tile{position:relative;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:18px;padding:14px 14px 16px;min-height:128px;display:flex;flex-direction:column;gap:6px;transition:.15s;color:var(--ink)}
.tile .num{width:38px;height:38px;border-radius:12px;background:var(--green-l);color:var(--green-d);display:grid;place-items:center;font-weight:900;font-size:17px}
.tile .tt{font-weight:800;font-size:15px;line-height:1.25}
.tile .st{margin-top:auto;font-size:12px;font-weight:900;letter-spacing:.03em;color:var(--green-d)}
.tile.open:hover{transform:translateY(-2px);border-color:#96e2c7}
.tile.cur{background:linear-gradient(160deg,#20c997,#0ca678);border-color:transparent;color:#fff;box-shadow:0 6px 0 #087f5b,0 10px 24px rgba(18,184,134,.35)}
.tile.cur .num{background:#fff;color:#0c9a70}
.tile.cur .st{color:#fff}
.tile.cur::after{content:'НОВЫЙ';position:absolute;top:10px;right:10px;background:var(--yellow);color:#3a2a00;font-size:10px;font-weight:900;padding:3px 7px;border-radius:999px;letter-spacing:.06em}
.tile.sel{outline:4px solid rgba(255,197,61,.8);outline-offset:2px}
.tile.locked{background:var(--off);border-color:var(--off-line);color:var(--off-ink);cursor:not-allowed}
.tile.locked .num{background:var(--off-line);color:var(--off-ink)}
.tile.locked .st{color:var(--off-ink)}
.tile .lock{position:absolute;top:12px;right:12px;font-size:18px;filter:grayscale(1);opacity:.7}
.panel{grid-column:1/-1;background:var(--card);border:2px solid #b2ecd9;border-radius:20px;padding:18px 20px;animation:slide .28s ease-out;box-shadow:0 10px 30px rgba(18,184,134,.12)}
@keyframes slide{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
.panel h4{margin:0 0 4px;font-size:20px}
.panel .acts{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}
.panel .btn{min-width:200px}
.prog{background:rgba(255,255,255,.25);border-radius:8px;padding:2px 8px;font-size:13px}
.btn.white .prog,.btn.disabled .prog{background:var(--green-l);color:var(--green-d)}
.soon{border:2px dashed var(--line);color:var(--muted);background:var(--body2);box-shadow:none;cursor:default}

/* teacher */
.tbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 18px;margin-bottom:18px}
.stat{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:800;font-size:14px}
.stat b{color:var(--green-d)}
.save-st{font-size:13px;font-weight:800;color:var(--muted);margin-left:auto}
.lrow{margin-bottom:10px;overflow:hidden}
.lhead{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;flex-wrap:wrap}
.lhead .num{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:900;background:var(--off-line);color:var(--muted);flex:none}
.lrow.isopen .lhead .num{background:var(--green-l);color:var(--green-d)}
.lrow.iscur .lhead .num{background:var(--green);color:#fff}
.lhead .tt{font-weight:800;font-size:16px;flex:1;min-width:160px}
.badge{font-size:11.5px;font-weight:900;padding:4px 9px;border-radius:999px;letter-spacing:.03em;white-space:nowrap}
.b-open{background:var(--green-l);color:var(--green-d);border:1px solid #b2ecd9}
.b-lock{background:var(--off);color:var(--muted);border:1px solid var(--line)}
.b-cur{background:var(--yellow);color:#3a2a00}
.tog{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 11px;font-weight:800;font-size:13px;color:var(--sub);white-space:nowrap}
.tog:hover{background:var(--soft-h)}
.chev{transition:.2s;color:var(--muted);font-size:14px}
.lrow.exp .chev{transform:rotate(180deg)}
.lbody{border-top:1px solid var(--line);padding:14px 16px 16px;background:var(--body2)}
.brow{display:grid;grid-template-columns:150px 1fr 1.6fr auto auto;gap:8px;align-items:center;margin-bottom:8px}
.brow .inp,.lbody .inp{font-size:14px;padding:8px 10px;border-radius:10px}
.brow select{font-size:14px;padding:8px;border:2px solid var(--line);border-radius:10px;background:var(--card);font-weight:700;color:var(--ink)}
.icob{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:15px;text-decoration:none;color:var(--ink)}
.icob:hover{background:var(--soft-h)}
.icob.del:hover{background:var(--red-l);border-color:#ffc9c9}
.icob.edit:hover{background:var(--blue-l);border-color:#93c5fd}
.icob.off{opacity:.35;pointer-events:none}
.brow-h{display:grid;grid-template-columns:150px 1fr 1.6fr 84px;gap:8px;font-size:12px;font-weight:900;color:var(--muted);margin:12px 0 6px;letter-spacing:.04em}
.add{border:2px dashed #b2ecd9;background:var(--green-l);color:var(--green-d);border-radius:12px;padding:9px 14px;font-weight:900;font-size:14px}

.slist{padding:6px 0}
.srow{display:grid;grid-template-columns:36px minmax(160px,1.1fr) minmax(200px,2fr) 120px 80px;gap:14px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow.h{font-size:12px;font-weight:900;color:var(--muted);letter-spacing:.04em;padding-top:14px;padding-bottom:10px}
.sname{font-weight:800;font-size:15.5px}
.spass{font-size:13px;color:var(--sub);margin-top:2px}
.spass code{background:var(--yellow-l);border:1px solid #ffe08a;border-radius:6px;padding:1px 6px;font-weight:800;color:var(--code-ink);font-family:ui-monospace,Consolas,monospace}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{font-size:11.5px;font-weight:800;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:2px 7px;color:var(--sub)}
.chip.done{background:var(--green-l);border-color:#b2ecd9;color:var(--green-d)}
.pct{font-weight:900;font-size:13px;color:var(--green-d);margin-bottom:4px}
.seen{font-size:12.5px;color:var(--muted)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.search{max-width:280px}
.sactions{display:flex;gap:6px;justify-content:flex-end}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(4px);z-index:50;display:grid;place-items:center;padding:20px;animation:fadein .2s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.modal{background:var(--card);border-radius:22px;padding:26px;width:100%;max-width:460px;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:slide .25s ease-out}
.modal h3{margin:0 0 4px;font-size:22px;display:flex;align-items:center;gap:10px}
.modal .msub{color:var(--muted);font-size:14px;margin-bottom:16px}
.modal .actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.modal .actions .btn{flex:1;min-width:120px}
.modal .genbtn{border:1px solid var(--line);background:var(--soft-h);border-radius:10px;padding:6px 10px;font-weight:800;font-size:12px;color:var(--sub);white-space:nowrap}
.modal .genbtn:hover{background:var(--soft)}
.pw-field{display:flex;gap:6px;align-items:stretch}
.pw-field .inp{flex:1}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--toast-bg);color:var(--toast-ink);padding:12px 18px;border-radius:14px;font-weight:800;z-index:70;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:slide .25s}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.loading{min-height:60vh;display:grid;place-items:center;color:var(--muted);font-weight:800}

/* chat */
.chat-fab{position:fixed;right:20px;bottom:20px;width:58px;height:58px;border-radius:50%;border:0;background:linear-gradient(180deg,#20c997,#0ca678);color:#fff;font-size:25px;box-shadow:0 4px 0 #087f5b,0 10px 24px rgba(18,184,134,.4);z-index:40;display:grid;place-items:center;cursor:pointer}
.chat-fab:hover{filter:brightness(1.05)}
.chat-fab:active{transform:translateY(1px)}
.chat-badge{position:absolute;top:-4px;right:-4px;min-width:22px;height:22px;border-radius:999px;background:var(--red);color:#fff;font-size:12px;font-weight:900;display:grid;place-items:center;padding:0 6px;border:2px solid var(--card)}
.chat-panel{position:fixed;right:20px;bottom:92px;width:min(360px,calc(100vw - 24px));height:min(480px,calc(100vh - 130px));background:var(--card);border-radius:20px;box-shadow:var(--shadow),0 20px 50px rgba(0,0,0,.25);z-index:41;display:flex;flex-direction:column;overflow:hidden;animation:slide .22s ease-out}
.chat-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:900;font-size:15px;flex:none}
.chat-head .back{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:4px 9px;font-weight:900;font-size:13px;color:var(--sub);cursor:pointer}
.chat-head .back:hover{background:var(--soft-h)}
.chat-head .x{margin-left:auto;border:0;background:transparent;font-size:16px;color:var(--muted);cursor:pointer;padding:2px 4px}
.chat-body{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--body2)}
.msg{max-width:82%;padding:8px 12px;border-radius:14px;font-size:14px;line-height:1.4;word-break:break-word}
.msg .mt{display:block;font-size:10.5px;opacity:.6;margin-top:2px;font-weight:800}
.msg.me{align-self:flex-end;background:var(--green);color:#fff;border-bottom-right-radius:4px}
.msg.them{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.chat-list{flex:1;overflow-y:auto}
.chat-srow{display:flex;gap:10px;align-items:center;padding:11px 14px;border:0;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left;background:transparent;font-family:inherit}
.chat-srow:hover{background:var(--soft-h)}
.chat-srow i{width:38px;height:38px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-style:normal;font-size:18px;flex:none}
.chat-srow .nm{font-weight:800;font-size:14px;color:var(--ink)}
.chat-srow .pv{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px;display:inline-block;vertical-align:bottom}
.chat-srow .tm{margin-left:auto;text-align:right;font-size:11.5px;color:var(--muted);flex:none}
.chat-srow .cnt{display:inline-block;margin-top:3px;background:var(--red);color:#fff;border-radius:999px;font-size:11px;font-weight:900;padding:1px 7px}
.chat-empty{padding:30px 18px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.5}
.chat-inp-row{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--card);flex:none}
.chat-inp{flex:1;font-size:14px;border:2px solid var(--line);border-radius:12px;padding:9px 12px;font-weight:700;color:var(--ink);background:var(--card);outline:none;min-width:0}
.chat-inp:focus{border-color:#96e2c7}
.chat-send{border:0;border-radius:12px;padding:0 16px;font-weight:900;font-size:15px;background:linear-gradient(180deg,#20c997,#0ca678);color:#fff;box-shadow:0 3px 0 #087f5b;cursor:pointer}
.chat-send:disabled{opacity:.5;cursor:not-allowed}
@media (max-width:560px){
  .chat-fab{right:14px;bottom:14px}
  .chat-panel{right:12px;left:12px;width:auto;bottom:84px}
}

@media (max-width:800px){
  .brow{grid-template-columns:1fr 1fr;}
  .brow .url{grid-column:1/-1}
  .brow-h{display:none}
  .srow{grid-template-columns:1fr;gap:6px}
  .srow.h{display:none}
  .srow .n{display:none}
  .sactions{justify-content:flex-start}
}
@media (max-width:560px){
  main{padding:14px 12px 40px}
  .top{padding:10px 12px}
  .brand span{display:none}
  .grid{grid-template-columns:repeat(2,1fr)}
  .panel .btn{min-width:0;width:100%}
}

const THEME_KEY = 'lms_theme_v1';

const curTheme = () => document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';
function syncThemeBtn(){ const b = $('#themeBtn'); if (b) b.textContent = themeIcon(); }
function applyTheme(t){ document.documentElement.dataset.theme = t; store.set(THEME_KEY, t); syncThemeBtn(); }
function toggleTheme(){
  const next = curTheme() === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  A.themeTouched = true;
  /* ученик — сохраняем тему в аккаунт; учитель/экран входа — только локально */
  if (A && A.session && A.session.role === 'student' && A.me && A.session.id) {

}
/* Тема из аккаунта: применяется при входе и синхронизируется,
   если её сменили на другом устройстве */
function accountTheme(me){
  const rt = me && (me.theme === 'dark' || me.theme === 'light') ? me.theme : null;
  if (!rt || !A.session || A.session.role !== 'student') return;
  if (A.themeTouched) {
    /* здесь тему уже выбирали — продвигаем свой вариант, если сервер отстаёт */
    if (rt !== curTheme()) DB.setStudent(A.session.id, {theme: curTheme()}).catch(() => {});
  } else if (rt !== curTheme()) {
    applyTheme(rt);
  }
}

function normalizeConfig(c){

function makeLocalDB(){
  const CK = 'lms_demo_config', SK = 'lms_demo_students', CH = 'lms_demo_chats';
  const subs = {config:new Set(), students:new Set(), chats:new Set()};
  const fire = () => { subs.config.forEach(cb => cb(store.get(CK, null))); const s = store.get(SK, {}); subs.students.forEach(cb => cb(Object.entries(s).map(([id, v]) => ({id, ...v})))); const c = store.get(CH, {}); subs.chats.forEach(cb => cb(c)); };
  window.addEventListener('storage', e => { if (e.key === CK || e.key === SK || e.key === CH) fire(); });
  return {
    demo: true,
    async getConfig(){ return store.get(CK, null); },
    async saveConfig(c){ store.set(CK, c); fire(); },
    onConfig(cb){ subs.config.add(cb); cb(store.get(CK, null)); return () => subs.config.delete(cb); },
    async getStudent(id){ return store.get(SK, {})[id] || null; },
    async setStudent(id, data){ const s = store.get(SK, {}); s[id] = Object.assign(s[id] || {}, data); store.set(SK, s); fire(); },
    async deleteStudent(id){ const s = store.get(SK, {}); delete s[id]; store.set(SK, s); const c = store.get(CH, {}); if (c[id]) { delete c[id]; store.set(CH, c); } fire(); },
    onStudents(cb){ subs.students.add(cb); const s = store.get(SK, {}); cb(Object.entries(s).map(([id, v]) => ({id, ...v}))); return () => subs.students.delete(cb); },
    async sendMsg(sid, msg){ const c = store.get(CH, {}); const t = c[sid] || {}; t.messages = (t.messages || []).concat([msg]); c[sid] = t; store.set(CH, c); fire(); },
    async markRead(sid, who, at){ const c = store.get(CH, {}); const t = c[sid] || {}; t[who + 'Read'] = at || Date.now(); c[sid] = t; store.set(CH, c); fire(); },
    onChats(cb){ subs.chats.add(cb); cb(store.get(CH, {})); return () => subs.chats.delete(cb); },
    onChat(sid, cb){ return this.onChats(c => cb(c[sid] || null)); },
    async moveChat(oldId, newId){ const c = store.get(CH, {}); if (c[oldId]) { c[newId] = c[oldId]; delete c[oldId]; store.set(CH, c); fire(); } },
    authReady(){ return Promise.resolve(null); },
    signIn(){ return Promise.reject(new Error('no-auth-in-demo')); },
    signOut(){ return Promise.resolve(); },
    createStudentAccount(){ return Promise.reject(new Error('no-auth-in-demo')); },
    onStudent(id, cb){ return this.onStudents(list => cb(list.find(x => x.id === id) || null)); },
    findStudentByUid(){ return Promise.resolve(null); }
  };
}
function makeFirebaseDB(){
  firebase.initializeApp(FIREBASE_CONFIG);
  const db = firebase.firestore(), auth = firebase.auth();
  const secondary = () => firebase.apps.find(a => a.name === 'student-admin') || firebase.initializeApp(FIREBASE_CONFIG, 'student-admin');
  const cfgRef = db.collection('lms').doc('config'), st = db.collection('students'), ch = db.collection('chats');
  return {
    demo: false,
    async getConfig(){ const s = await cfgRef.get(); return s.exists ? s.data() : null; },
    async saveConfig(c){ await cfgRef.set(JSON.parse(JSON.stringify(c))); },
    onConfig(cb){ return cfgRef.onSnapshot(s => cb(s.exists ? s.data() : null), e => toast('Нет связи с базой: ' + e.message)); },
    async getStudent(id){ const s = await st.doc(id).get(); return s.exists ? s.data() : null; },
    async setStudent(id, data){ await st.doc(id).set(JSON.parse(JSON.stringify(data)), {merge:true}); },
    async deleteStudent(id){ await st.doc(id).delete(); ch.doc(id).delete().catch(() => {}); },
    onStudents(cb){ return st.onSnapshot(q => cb(q.docs.map(d => ({id:d.id, ...d.data()}))), e => toast('Нет связи с базой: ' + e.message)); },
    async sendMsg(sid, msg){ await ch.doc(sid).set({messages: firebase.firestore.FieldValue.arrayUnion(JSON.parse(JSON.stringify(msg)))}, {merge:true}); },
    async markRead(sid, who, at){ const v = {}; v[who + 'Read'] = at || Date.now(); await ch.doc(sid).set(v, {merge:true}); },
    onChats(cb){ return ch.onSnapshot(q => { const m = {}; q.docs.forEach(d => m[d.id] = d.data()); cb(m); }, e => toast('Нет связи с чатом: ' + e.message)); },
    onChat(sid, cb){ return ch.doc(sid).onSnapshot(d => cb(d.exists ? d.data() : null), e => toast('Нет связи с чатом: ' + e.message)); },
    async moveChat(oldId, newId){ const d = await ch.doc(oldId).get(); if (!d.exists) return; await ch.doc(newId).set(d.data()); await ch.doc(oldId).delete().catch(() => {}); },
    authReady(){ return new Promise(res => { const u = auth.currentUser; if (u) return res(u); const off = auth.onAuthStateChanged(x => { off(); res(x); }); }); },
    signIn(email, pw){ return auth.signInWithEmailAndPassword(email, pw); },
    signOut(){ return auth.signOut(); },
    /* создаёт аккаунт входа ученику ОТ ИМЕНИ УЧИТЕЛЯ (через второе приложение, сессия учителя не трогается) */
    async createStudentAccount(email, pw){
      const app2 = secondary();
      const cred = await app2.auth().createUserWithEmailAndPassword(email, pw);
      await app2.auth().signOut();
      return cred.user.uid;
    },
    onStudent(id, cb){ return st.doc(id).onSnapshot(d => cb(d.exists ? {id: d.id, ...d.data()} : null), e => toast('Нет связи с базой: ' + e.message)); },
    findStudentByUid(uid){ return st.where('authUid', '==', uid).limit(1).get().then(q => q.empty ? null : {id: q.docs[0].id, ...q.docs[0].data()}); }
  };
}

   ====================================================================== */
const pkey = url => String(url).replace(/[^a-zA-Z0-9]/g, '_').slice(0, 300);
function trackerFor(url){
  const u = decodeURIComponentSafe(url);
  return TRACKERS.find(t => u.includes(t.match)) || null;
}
function decodeURIComponentSafe(u){ try { return decodeURI(u); } catch (e) { return u; } }
function readTracker(url){
  const t = trackerFor(url);
  if (t) {
    try { const raw = localStorage.getItem(t.key); if (raw) { const r = t.read(JSON.parse(raw)); if (r && r.total) return r; } } catch (e) {}
    return null;
  }
  const g = store.get('lms_progress', null);
  if (g && typeof g === 'object') for (const k in g) if (k && decodeURIComponentSafe(url).includes(k) && g[k] && g[k].total) return g[k];
  return null;
}
function taskList(cfg, onlyOpen){
  const out = [];
  cfg.lessons.forEach((l, li) => {
    if (onlyOpen && !l.open) return;
    l.buttons.forEach(b => { if (b.kind === 'task' && safeUrl(b.url)) out.push({li, b}); });
  });
  return out;
}
function studentStats(st, cfg){
  const items = taskList(cfg, true).map(({li, b}) => {
    const p = (st.progress || {})[pkey(b.url)] || {};
    const tracked = !!trackerFor(b.url) || (p.total > 0);
    let frac, text;
    if (p.total > 0) { frac = Math.min(1, p.done / p.total); text = `${p.done}/${p.total}`; }
    else if (tracked) { frac = 0; text = p.opened ? '0 · открыто' : '—'; }
    else { frac = p.opened ? 1 : 0; text = p.opened ? '✓ открыто' : '—'; }
    return {li, label:b.label, frac, text};
  });
  const pct = items.length ? Math.round(items.reduce((s, x) => s + x.frac, 0) / items.length * 100) : 0;
  return {pct, items};
}

/* ===== Пароли: храним только SHA-256-хеш, сам пароль в базе не лежит ===== */
async function hashPw(pw){
  const data = new TextEncoder().encode('pystart::v1:' + pw);
  try {
    const buf = await crypto.subtle.digest('SHA-256', data);
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  } catch (e) { return 'plain:' + pw; } /* нет crypto.subtle (старый браузер) — пароль мигрирует в хеш позже */
}
const isHash = s => typeof s === 'string' && /^[0-9a-f]{64}$/.test(s);

/* email-логин ученика для Firebase Authentication (кириллицу переводим в латиницу) */
const TRANSLIT = {а:'a',б:'b',в:'v',г:'g',д:'d',е:'e',ё:'e',ж:'zh',з:'z',и:'i',й:'y',к:'k',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'h',ц:'c',ч:'ch',ш:'sh',щ:'sch',ъ:'',ы:'y',ь:'',э:'e',ю:'yu',я:'ya'};
const authEmail = id => id.split('').map(ch => TRANSLIT[ch] !== undefined ? TRANSLIT[ch] : ch).join('') + '@pystart.ru';
const authErrText = e => {
  const c = e && e.code;
  if (c === 'auth/weak-password') return 'Пароль слишком короткий — минимум 6 символов';
  if (c === 'auth/email-already-in-use') return 'Такой аккаунт входа уже существует';
  if (c === 'auth/too-many-requests') return 'Слишком много попыток — подожди пару минут';
  return 'Не удалось создать аккаунт входа. Проверь интернет.';
};

function toast(msg){
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}
function confetti(){
  const c = $('#confetti'), x = c.getContext('2d'); c.width = innerWidth; c.height = innerHeight;
  const cols = ['#20c997', '#ffc53d', '#7c4dff', '#ff6b6b', '#4dabf7', '#ff922b'];
  const ps = Array.from({length:140}, () => ({x:innerWidth / 2, y:innerHeight / 3, vx:(Math.random() - .5) * 16, vy:-Math.random() * 13 - 3, s:Math.random() * 8 + 5, c:cols[Math.floor(Math.random() * cols.length)], r:Math.random() * 6, vr:(Math.random() - .5) * .4}));
  let f = 0;
  (function tick(){
    x.clearRect(0, 0, c.width, c.height);
    ps.forEach(p => { p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore(); });
    if (++f < 160) requestAnimationFrame(tick); else x.clearRect(0, 0, c.width, c.height);
  })();
}

const demoBanner = () => DB.demo ? `<div class="banner"><span style="font-size:22px">⚠️</span><div><b>Демо-режим.</b> База Firebase не подключена, поэтому уроки и ученики сохраняются только в этом браузере. Чтобы ученики видели уроки на своих компьютерах, подключите Firebase по инструкции из файла «Инструкция.txt».</div></div>` : '';

function curLesson(cfg){ let k = -1; cfg.lessons.forEach((l, i) => { if (l.open) k = i; }); return k; }

function renderStudent(){

      <div style="min-width:220px"><div style="display:flex;justify-content:space-between;font-weight:800;font-size:14px;margin-bottom:6px"><span>Мой прогресс</span><span style="color:var(--green-d)">${stats.pct}%</span></div><div class="bar"><i style="width:${stats.pct}%"></i></div><div class="muted" style="font-size:12.5px;margin-top:6px">Открыто уроков: ${openN} из ${cfg.lessons.length}</div></div>
    </div>
    <h3 class="sec">📚 Мои уроки</h3>
    <div class="grid" id="grid">
      ${cfg.lessons.map((l, i) => `
        <button class="tile ${l.open ? 'open' : 'locked'} ${i === cur ? 'cur' : ''} ${i === A.sel ? 'sel' : ''}" data-i="${i}" ${l.open ? '' : 'aria-disabled="true"'}>

          <span class="num">${i + 1}</span>
          <span class="tt">${esc(l.title || 'Урок ' + (i + 1))}</span>
          <span class="st">${!l.open ? 'ЗАКРЫТ' : i === cur ? '▶ ТЕКУЩИЙ УРОК' : '✓ ОТКРЫТ'}</span>
        </button>`).join('')}
    </div>
  </main>`;
  bindHeader();
  document.querySelectorAll('.tile').forEach(t => t.onclick = () => {
    const i = +t.dataset.i;

    A.sel = A.sel === i ? null : i; renderStudent();
  });
  placePanel();
  window.scrollTo(0, scrollY);
}
function placePanel(){
  const old = document.querySelector('.panel'); if (old) old.remove();
  if (A.sel == null || !A.cfg.lessons[A.sel] || !A.cfg.lessons[A.sel].open) return;
  const tiles = [...document.querySelectorAll('.tile')], t = tiles[A.sel];
  let last = t; for (const x of tiles) if (x.offsetTop === t.offsetTop) last = x;
  const l = A.cfg.lessons[A.sel], prog = A.me.progress || {};
  const p = document.createElement('div'); p.className = 'panel';
  const btns = l.buttons.map((b, bi) => {
    const u = safeUrl(b.url);
    if (!u) return `<span class="btn soon">${b.kind === 'pres' ? '📊' : '🧩'} ${esc(b.label)} · скоро</span>`;
    const pr = prog[pkey(u)];
    const badge = b.kind === 'task' && pr && pr.total ? `<span class="prog">${pr.done}/${pr.total}</span>` : '';
    return `<a class="btn ${b.kind === 'pres' ? 'purple' : 'green'}" href="${esc(u)}" target="_blank" rel="noopener" data-bi="${bi}">${b.kind === 'pres' ? '📊' : '🧩'} ${esc(b.label)} ${badge}</a>`;
  }).join('');
  p.innerHTML = `<h4>${esc(l.title)}</h4><div class="muted">Сначала посмотри презентацию, потом выполни задания. Они откроются в новой вкладке.</div><div class="acts">${btns || '<span class="muted">Материалы появятся позже</span>'}</div>`;
  last.after(p);
  p.querySelectorAll('a[data-bi]').forEach(a => a.addEventListener('click', () => markOpened(l.buttons[+a.dataset.bi].url)));
}
async function markOpened(url){
  const k = pkey(url), prog = Object.assign({}, A.me.progress || {});
  prog[k] = Object.assign({}, prog[k], {opened:true, at:Date.now()});
  A.me.progress = prog;
  try { await DB.setStudent(A.session.id, {progress:prog, lastSeen:Date.now()}); } catch (e) {}
}
async function syncProgress(){
  if (!A.session || A.session.role !== 'student' || !A.me || !A.cfg) return;
  const prog = Object.assign({}, A.me.progress || {});
  let changed = false;
  for (const {b} of taskList(A.cfg, false)) {
    const r = readTracker(b.url); if (!r) continue;
    const k = pkey(b.url), old = prog[k] || {};
    if (old.done !== r.done || old.total !== r.total || old.xp !== r.xp) { prog[k] = Object.assign({}, old, {done:r.done, total:r.total, xp:r.xp || 0, at:Date.now()}); changed = true; }
  }
  const stale = Date.now() - (A.me.lastSeen || 0) > 5 * 60 * 1000;
  if (!changed && !stale) return;
  A.me.progress = prog; A.me.lastSeen = Date.now();
  try { await DB.setStudent(A.session.id, {progress:prog, lastSeen:A.me.lastSeen}); } catch (e) {}
  if (changed) renderStudent();
}
window.addEventListener('focus', syncProgress);
document.addEventListener('visibilitychange', () => { if (!document.hidden) syncProgress(); });
setInterval(() => { if (!document.hidden) syncProgress(); }, 30000);
let rsT = 0;
window.addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(() => { if (A.session && A.session.role === 'student') placePanel(); }, 120); });

function bindLessons(){
  $('#openNext').onclick = () => {
    const n = A.cfg.lessons.findIndex(l => !l.open); if (n < 0) return;
    A.cfg.lessons[n].open = true; saveCfg(); renderTeacher();

  document.querySelectorAll('.lrow').forEach(row => {
    const i = +row.dataset.i, l = A.cfg.lessons[i];
    row.addEventListener('click', e => {
      const act = e.target.closest('[data-act]'); if (!act) return;
      const a = act.dataset.act;
      if (a === 'exp') { if (e.target.closest('.lbody')) return; A.exp[i] = !A.exp[i]; renderTeacher(); }
      else if (a === 'toggle') { e.stopPropagation(); l.open = !l.open; saveCfg(); renderTeacher(); }
      else if (a === 'add') { l.buttons.push({kind:'task', label:`Задание ${l.buttons.filter(b => b.kind === 'task').length + 1}`, url:''}); saveCfg(); renderTeacher(); }
      else if (a === 'del') {
        const bi = +act.closest('.brow').dataset.bi;
        if (!confirm(`Удалить кнопку «${l.buttons[bi].label}»?`)) return;
        l.buttons.splice(bi, 1); saveCfg(); renderTeacher();
      }
    });
    row.addEventListener('input', e => {
      const f = e.target.dataset.f; if (!f) return;

        const b = l.buttons[+e.target.closest('.brow').dataset.bi];

function fmtSeen(t){
  if (!t) return '—';
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 2) return 'только что'; if (m < 60) return `${m} мин назад`;
  const h = Math.round(m / 60); if (h < 24) return `${h} ч назад`;
  return new Date(t).toLocaleDateString('ru-RU', {day:'numeric', month:'short'});
}

const teacherEditing = () => { const a = document.activeElement; return a && a.closest && a.closest('.lbody'); };

/* ======================================================================
   🆕 МОДАЛКА РЕДАКТИРОВАНИЯ ЛОГИНА (ФИО) И ПАРОЛЯ УЧЕНИКА
   ====================================================================== */
function randomPassword(len = 8){
  const chars = 'abcdefghijkmnpqrstuvwxyz23456789';
  let s = ''; for (let i = 0; i < len; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}

function openEditStudentModal(st){
  const isNew = !st;
  const hasAuth = !!(st && st.authUid); /* есть ли аккаунт входа Firebase */
  const minPw = DB.demo ? 4 : 6; /* Firebase Authentication требует минимум 6 символов */
  const saveLabel = isNew ? '➕ Создать' : '💾 Сохранить';
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal" role="dialog" aria-modal="true">
      <h3>${isNew ? '➕ Новый ученик' : '✏️ Данные ученика'}</h3>
      <div class="msub">${isNew
        ? 'Создаст аккаунт: ученик будет входить по фамилии+имени и этому паролю. Запиши пароль и передай ученику на уроке.'
        : 'Измени фамилию, имя и/или пароль. Ученик входит по фамилии+имени — при их изменении изменится и его «логин» на сайте, а прогресс и переписка сохранятся. Текущий пароль не показывается: если ученик забыл пароль — задай новый и передай ему.'}</div>

      <label class="f" for="mLast">Фамилия</label>
      <input class="inp" id="mLast" value="${st ? esc(st.last) : ''}" maxlength="40" placeholder="Иванов">

      <label class="f" for="mFirst">Имя</label>
      <input class="inp" id="mFirst" value="${st ? esc(st.first) : ''}" maxlength="40" placeholder="Иван">

      <label class="f" for="mPass">${hasAuth ? 'Новый пароль' : 'Пароль для входа'}</label>
      <div class="pw-field">
        <input class="inp" id="mPass" value="" ${hasAuth ? 'placeholder="пусто — не менять пароль"' : 'placeholder="минимум ' + minPw + ' символов"'} maxlength="40" autocomplete="new-password">
        <button type="button" class="genbtn" id="mGenPass" title="Сгенерировать новый пароль">🎲 новый</button>
      </div>
      ${!isNew && !hasAuth && !DB.demo ? '<div class="hint">У этого ученика ещё нет аккаунта входа — задай пароль, и аккаунт создастся. Скажи пароль ученику на уроке.</div>' : ''}

      <div class="err" id="mErr" style="min-height:18px"></div>

      <div class="actions">
        <button class="btn white" id="mCancel">Отмена</button>
        <button class="btn green" id="mSave">${saveLabel}</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  const close = () => overlay.remove();
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
  overlay.querySelector('#mCancel').onclick = close;

  overlay.querySelector('#mGenPass').onclick = () => {
    overlay.querySelector('#mPass').value = randomPassword(Math.max(8, minPw + 2));
  };

  overlay.querySelector('#mSave').onclick = async () => {
    const err = overlay.querySelector('#mErr'); err.textContent = '';
    const newLast = cap(overlay.querySelector('#mLast').value);
    const newFirst = cap(overlay.querySelector('#mFirst').value);
    const newPass = overlay.querySelector('#mPass').value;

    if (!newLast || !newFirst) { err.textContent = 'Фамилия и имя не могут быть пустыми'; return; }
    /* без аккаунта входа пароль обязателен (в демо можно оставить старый) */
    const passRequired = isNew || (!DB.demo && !hasAuth);
    if (!newPass && passRequired) { err.textContent = 'Задай пароль — без него ученик не сможет войти'; return; }
    if (newPass && newPass.length < minPw) { err.textContent = 'Пароль должен быть не короче ' + minPw + ' символов'; return; }

    const newId = studentId(newLast, newFirst);
    const idChanged = !isNew && newId !== st.id;
    const passChanged = !!newPass; /* пустое поле = пароль не меняем */
    const nameChanged = !isNew && (newLast !== st.last || newFirst !== st.first);

    /* Проверка: если ФИО изменились — нет ли уже такого ученика */
    if ((isNew || idChanged) && A.students.some(s => s.id === newId)) {
      err.textContent = `Ученик ${newLast} ${newFirst} уже существует. Нельзя задать такие же ФИО.`;
      return;
    }

    if (!isNew && !idChanged && !passChanged && !nameChanged) { close(); return; }

    const saveBtn = overlay.querySelector('#mSave');
    saveBtn.disabled = true; saveBtn.textContent = 'Сохраняю…';

    try {
      /* собираем запись ученика */
      const base = isNew
        ? {created: Date.now(), lastSeen: Date.now(), progress: {}}
        : Object.assign({}, st);
      delete base.id;
      const data = Object.assign(base, {last: newLast, first: newFirst, password: passChanged ? await hashPw(newPass) : st.password});

      /* аккаунт входа Firebase: создаём, если его нет, или заводим новый при смене пароля */
      if (!DB.demo && (isNew || !hasAuth || (passChanged && hasAuth))) {
        const email = authEmail(idChanged ? newId : st.id);
        let uid = null;
        try { uid = await DB.createStudentAccount(email, newPass); }
        catch (x) {
          if (x && x.code === 'auth/email-already-in-use') {
            /* пароль старого аккаунта сбросить нельзя — заводим новый вариант логина */
            for (let n = 2; n <= 9 && !uid; n++) {
              try { uid = await DB.createStudentAccount(email.replace('@', '+' + n + '@'), newPass); }
              catch (y) { if (!(y && y.code === 'auth/email-already-in-use')) throw y; }
            }
            if (!uid) throw x;
          } else throw x;
        }
        data.authUid = uid;
      }

      if (isNew) {
        await DB.setStudent(newId, data);
        toast(`Ученик ${newLast} ${newFirst} создан 🎉 Запиши и передай ему пароль!`);
      } else if (idChanged) {
        await DB.setStudent(newId, data);
        await DB.moveChat(st.id, newId); /* переносим переписку на новый id, чтобы история не потерялась */
        await DB.deleteStudent(st.id);
        /* в браузере ученика сессия обновится сама: он найдёт свой аккаунт по authUid */
        toast('Данные ученика обновлены ✅');
      } else {
        await DB.setStudent(st.id, data);
        toast('Данные ученика обновлены ✅');
      }
      close();
    } catch (e) {
      err.textContent = (e && e.code) ? authErrText(e) : 'Не удалось сохранить: ' + ((e && e.message) || e);
      saveBtn.disabled = false; saveBtn.textContent = saveLabel;
    }
  };

  setTimeout(() => overlay.querySelector('#mLast').focus(), 50);
}

/* ======================================================================
   ЧАТ (ученик ↔ учитель). Ученик пишет только учителю, учитель — ученикам.
   Переписка учеников между собой технически невозможна: каждый ученик
   пишет только в свой диалог chats/{его id}.
   ====================================================================== */
const chatS = { open: false, sid: null, drafts: {}, keepFocus: false, wasNearBottom: true };
const lastChatAt = sid => { const ms = chatMsgs(sid); return ms.length ? ms[ms.length - 1].at : 0; };
function chatThread(sid){ return (A.chatData || {})[sid] || null; }
function chatMsgs(sid){ const t = chatThread(sid); return t && Array.isArray(t.messages) ? t.messages.slice().sort((a, b) => a.at - b.at) : []; }
function chatUnread(sid, who){ /* who: 's' — непрочитанное учеником, 't' — учителем */
  const t = chatThread(sid), r = (t && (who === 's' ? t.sRead : t.tRead)) || 0;
  return chatMsgs(sid).filter(m => m.from !== who && m.at > r).length;
}
const fmtChatTime = t => new Date(t).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});

function renderChat(){
  const root = $('#chatRoot'); if (!root) return;
  if (!A.session) { root.innerHTML = ''; return; }
  const teacher = A.session.role === 'teacher';
  /* запоминаем состояние ПЕРЕД перерисовкой: фокус в поле ввода и позицию скролла */
  chatS.keepFocus = !!(document.activeElement && document.activeElement.id === 'chatInp');
  const oldBox = $('#chatMsgs');
  chatS.wasNearBottom = !oldBox || oldBox.scrollHeight - oldBox.scrollTop - oldBox.clientHeight < 60;
  /* если выбранный ученик удалён — возвращаемся к списку диалогов */
  if (teacher && chatS.sid && !A.students.some(x => x.id === chatS.sid)) chatS.sid = null;
  const unread = teacher ? A.students.reduce((s, x) => s + chatUnread(x.id, 't'), 0) : chatUnread(A.session.id, 's');
  root.innerHTML = `${chatS.open ? chatPanelHTML(teacher) : ''}
    <button class="chat-fab" id="chatFab" title="Чат с ${teacher ? 'учениками' : 'учителем'}">${chatS.open ? '✕' : '💬'}${unread && !chatS.open ? `<span class="chat-badge">${unread > 99 ? '99+' : unread}</span>` : ''}</button>`;
  bindChat(teacher);
}
function chatPanelHTML(teacher){
  if (teacher && !chatS.sid) {
    const list = A.students.slice().sort((a, b) => lastChatAt(b.id) - lastChatAt(a.id));
    return `<div class="chat-panel">
      <div class="chat-head">💬 Чат с учениками<span class="x" data-act="close">✕</span></div>
      <div class="chat-list">
        ${list.map(s => {
          const ms = chatMsgs(s.id), last = ms[ms.length - 1], un = chatUnread(s.id, 't');
          return `<button class="chat-srow" data-sid="${esc(s.id)}"><i>🎒</i>
            <span style="min-width:0;flex:1"><span class="nm">${esc(s.last)} ${esc(s.first)}</span><br><span class="pv">${last ? esc((last.from === 't' ? 'Вы: ' : '') + last.text) : 'начать переписку'}</span></span>
            <span class="tm">${last ? fmtSeen(last.at) : ''}${un ? `<br><span class="cnt">${un}</span>` : ''}</span>
          </button>`;
        }).join('') || `<div class="chat-empty">Пока ни один ученик не зарегистрировался.</div>`}
      </div>
    </div>`;
  }
  const sid = teacher ? chatS.sid : A.session.id;
  const me = teacher ? 't' : 's';
  const nm = teacher ? (A.students.find(x => x.id === sid) || {last:'', first:''}) : null;
  return `<div class="chat-panel">
    <div class="chat-head">${teacher ? `<button class="back" data-act="back">←</button>🎒 ${esc(nm.last)} ${esc(nm.first)}` : '🧑‍🏫 Чат с учителем'}<span class="x" data-act="close">✕</span></div>
    <div class="chat-body" id="chatMsgs">
      ${chatMsgs(sid).map(m => `<div class="msg ${m.from === me ? 'me' : 'them'}">${esc(m.text)}<span class="mt">${fmtChatTime(m.at)}</span></div>`).join('') || `<div class="chat-empty">${teacher ? 'Напишите ученику первым — он увидит сообщение в чате.' : 'Здесь можно задать вопрос учителю 🙂'}</div>`}
    </div>
    <div class="chat-inp-row">
      <input class="chat-inp" id="chatInp" maxlength="500" placeholder="Сообщение…" value="${esc(chatS.drafts[sid] || '')}">
      <button class="chat-send" id="chatSend" title="Отправить">➤</button>
    </div>
  </div>`;
}
function bindChat(teacher){
  $('#chatFab').onclick = () => { chatS.open = !chatS.open; if (!chatS.open) chatS.sid = null; renderChat(); };
  const panel = document.querySelector('.chat-panel'); if (!panel) return;
  panel.querySelectorAll('[data-act="close"]').forEach(x => x.onclick = () => { chatS.open = false; chatS.sid = null; renderChat(); });
  panel.querySelectorAll('[data-act="back"]').forEach(x => x.onclick = () => { chatS.sid = null; renderChat(); });
  panel.querySelectorAll('.chat-srow').forEach(r => r.onclick = () => { chatS.sid = r.dataset.sid; renderChat(); });
  const inp = $('#chatInp');
  if (!inp) return;
  const dlg = teacher ? chatS.sid : A.session.id; /* id диалога — черновик хранится отдельно для каждого */
  inp.oninput = () => { chatS.drafts[dlg] = inp.value; const b = $('#chatSend'); if (b) b.disabled = !inp.value.trim(); };
  inp.onkeydown = e => { if (e.key === 'Enter') sendChat(); };
  const sb = $('#chatSend'); sb.onclick = sendChat; sb.disabled = !inp.value.trim();
  if (chatS.keepFocus) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
  const box = $('#chatMsgs'); if (box && chatS.wasNearBottom) box.scrollTop = box.scrollHeight;
  markChatRead();
}
async function sendChat(){
  const inp = $('#chatInp'); if (!inp) return;
  const text = inp.value.trim().slice(0, 500); if (!text) return;
  const sid = A.session.role === 'teacher' ? chatS.sid : A.session.id; if (!sid) return;
  const msg = {from: A.session.role === 'teacher' ? 't' : 's', text, at: Date.now()};
  inp.value = ''; delete chatS.drafts[sid];
  const sb = $('#chatSend'); if (sb) sb.disabled = true;
  try { await DB.sendMsg(sid, msg); }
  catch (e) { toast('Сообщение не отправилось — попробуй ещё раз'); inp.value = text; chatS.drafts[sid] = text; if (sb) sb.disabled = false; }
}
function markChatRead(){
  if (!chatS.open) return;
  const teacher = A.session.role === 'teacher';
  const sid = teacher ? chatS.sid : A.session.id;
  if (!sid) return;
  const who = teacher ? 't' : 's';
  const ms = chatMsgs(sid);
  /* запоминаем время последнего сообщения, а не локальные часы — иначе при
     расхождении часов устройств «непрочитанное» может никогда не обнулиться */
  if (ms.length && chatUnread(sid, who) > 0) DB.markRead(sid, who, ms[ms.length - 1].at).catch(() => {});
}

/* ======================================================================
   ЗАПУСК
   ====================================================================== */
async function start(){
  stopSubs();
  $('#app').innerHTML = '<div class="loading">Загрузка…</div>';
  const s = A.session;
  if (!s) return renderLogin();
  if (!DB.demo) {
    /* проверяем настоящий вход (Firebase Authentication) */
    const user = await DB.authReady();
    if (!user) { A.session = null; store.del(SESSION_KEY); return renderLogin(); }
    if (s.role === 'teacher' && user.email !== TEACHER_EMAIL) { A.session = null; store.del(SESSION_KEY); return renderLogin(); }
    if (s.role === 'student') {
      if (!s.uid) { s.uid = user.uid; store.set(SESSION_KEY, s); }
      else if (s.uid !== user.uid) { A.session = null; store.del(SESSION_KEY); return renderLogin(); }
    }
  }
  const teacherUI = s.role === 'teacher';
  /* чат: учитель слушает все диалоги, ученик — только свой (чужие переписки не загружаются) */
  const subStudentChat = id => { chatUnsub = DB.onChat(id, m => { A.chatData = { [id]: m || {} }; renderChat(); }); };
  let chatUnsub = null;
  if (teacherUI) A.unsub.push(DB.onChats(m => { A.chatData = m || {}; renderChat(); }));
  if (teacherUI) {
    A.view = 'lessons';
    let first = true;
    A.unsub.push(DB.onConfig(c => {
      if (!c && first) { A.cfg = defaultConfig(); DB.saveConfig(A.cfg).catch(() => {}); }
      else if (c && !A.dirty && !teacherEditing()) A.cfg = normalizeConfig(c);
      else if (!c && !A.cfg) A.cfg = defaultConfig();
      first = false;
      if (!teacherEditing()) renderTeacher();
    }));
    A.unsub.push(DB.onStudents(list => { A.students = list; renderChat(); if (A.cfg && !teacherEditing() && !(A.view === 'students' && document.activeElement && document.activeElement.id === 'search')) renderTeacher(); }));
    return;
  }
  /* ===== ученик ===== */
  const handleMe = me => {
    if (!me) { if (A.me) { toast('Аккаунт удалён учителем'); logout(); } return; }
    const firstLoad = !A.me;
    A.me = me;
    accountTheme(me); /* подтягиваем тему из аккаунта (или отдаём свою) */
    if (A.cfg) { if (firstLoad) syncProgress(); renderStudent(); }
  };
  subStudentChat(s.id);
  A.unsub.push(() => { if (chatUnsub) chatUnsub(); }); /* подписка на чат может переподключаться при переименовании */
  if (DB.demo) {
    A.unsub.push(DB.onStudents(list => {
      let me = list.find(x => x.id === s.id);
      if (!me && A.me) {
        /* ученика с таким id нет — возможно, учитель его переименовал (дата создания сохраняется) */
        const cand = list.find(x => x.created && x.created === A.me.created && x.id !== s.id);
        if (cand) { s.id = cand.id; store.set(SESSION_KEY, s); subStudentChat(s.id); me = cand; }
      }
      handleMe(me);
    }));
  } else {
    /* Firebase: слушаем ТОЛЬКО свой документ (правила не дают читать чужие) */
    let studentUnsub = null;
    const subMe = () => {
      studentUnsub = DB.onStudent(s.id, me => {
        if (me) return handleMe(me);
        /* документ пропал — учитель мог переименовать: ищем по аккаунту входа (authUid) */
        DB.findStudentByUid(s.uid).then(cand => {
          if (cand) {
            s.id = cand.id; store.set(SESSION_KEY, s);
            subStudentChat(s.id); subMe(); /* переподключаемся к новому id */
            handleMe(cand);
          } else handleMe(null);
        }).catch(() => handleMe(null));
      });
    };
    subMe();
    A.unsub.push(() => { if (studentUnsub) studentUnsub(); });
  }
  A.unsub.push(DB.onConfig(c => {
    A.cfg = normalizeConfig(c);
    const n = A.cfg.lessons.filter(l => l.open).length;
    if (A.openCount != null && n > A.openCount) {
      const cur = curLesson(A.cfg); A.sel = cur;
      toast(`🎉 Учитель открыл новый урок: ${A.cfg.lessons[cur].title}`); confetti();
    }
    A.openCount = n;
    if (A.me) { renderStudent(); syncProgress(); }
  }));
  setTimeout(async () => { if (A.session && A.session.role === 'student' && !A.me) { const st = await DB.getStudent(s.id).catch(() => null); if (!st) logout(); } }, 4000);
}
start();
</script>
